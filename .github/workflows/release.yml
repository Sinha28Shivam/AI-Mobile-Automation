name: Release build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Minified release build + R8 smoke check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Configure required reviewers on this environment to protect the signing secrets.
    environment: release
    env:
      HAS_SIGNING: ${{ secrets.KEYSTORE_BASE64 != '' && secrets.KEYSTORE_PASSWORD != '' && secrets.KEY_ALIAS != '' && secrets.KEY_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6
        with:
          # Never let a release build read or write a shared cache.
          cache-disabled: true

      - name: Prepare signing (secrets never printed)
        if: env.HAS_SIGNING == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set +x
          umask 077
          ks="$RUNNER_TEMP/jarvis-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$ks"
          {
            printf 'storeFile=%s\n' "$ks"
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > keystore.properties
          echo "Signing configured."

      - name: No signing secrets
        if: env.HAS_SIGNING != 'true'
        run: echo "::warning::Signing secrets are not configured. The release APK will be UNSIGNED and cannot be installed."

      - name: Assemble minified release
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Remove signing material
        if: always()
        run: rm -f keystore.properties "$RUNNER_TEMP/jarvis-release.jks"

      - name: Locate APK
        id: apk
        run: |
          if [ "$HAS_SIGNING" = "true" ]; then
            apk=app/build/outputs/apk/release/app-release.apk
            label=signed
          else
            apk=app/build/outputs/apk/release/app-release-unsigned.apk
            label=UNSIGNED
          fi
          test -f "$apk" || { echo "::error::Expected $apk"; ls -la app/build/outputs/apk/release/; exit 1; }
          echo "path=$apk" >> "$GITHUB_OUTPUT"
          echo "label=$label" >> "$GITHUB_OUTPUT"

      - name: "R8 smoke check: native libraries packaged"
        run: |
          apk="${{ steps.apk.outputs.path }}"
          listing=$(unzip -l "$apk")
          missing=0
          for lib in lib/arm64-v8a/libvosk.so lib/arm64-v8a/libjnidispatch.so lib/armeabi-v7a/libvosk.so lib/armeabi-v7a/libjnidispatch.so; do
            if grep -q " $lib\$" <<<"$listing"; then echo "OK  $lib"; else echo "::error::Missing $lib"; missing=1; fi
          done
          echo "All native libraries:"; grep ' lib/' <<<"$listing" || true
          exit $missing

      - name: "R8 smoke check: Vosk/JNA classes kept"
        run: |
          apk="${{ steps.apk.outputs.path }}"
          analyzer="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          if [ ! -x "$analyzer" ]; then analyzer=$(command -v apkanalyzer || true); fi
          test -n "$analyzer" || { echo "::error::apkanalyzer not found"; exit 1; }
          "$analyzer" dex packages --defined-only "$apk" > dex-packages.txt
          fail=0
          for cls in org.vosk.Model org.vosk.Recognizer org.vosk.LibVosk com.sun.jna.Native com.sun.jna.Pointer com.sun.jna.Library; do
            if grep -qE "^C .* ${cls//./\\.}\$" dex-packages.txt; then echo "OK  $cls"; else echo "::error::R8 removed or renamed $cls"; fail=1; fi
          done
          exit $fail

      - name: Verify signature
        if: env.HAS_SIGNING == 'true'
        run: |
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)
          "$bt/apksigner" verify --verbose --print-certs "${{ steps.apk.outputs.path }}" | grep -vi 'warning' || true
          "$bt/apksigner" verify "${{ steps.apk.outputs.path }}"

      - name: Checksum
        id: sum
        run: |
          apk="${{ steps.apk.outputs.path }}"
          out="jarvis-${GITHUB_REF_NAME//\//-}-${{ steps.apk.outputs.label }}.apk"
          cp "$apk" "$out"
          sha256sum "$out" | tee "$out.sha256"
          echo "file=$out" >> "$GITHUB_OUTPUT"
          {
            echo "### Release APK (${{ steps.apk.outputs.label }})"
            echo '```'; cat "$out.sha256"; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          name: jarvis-release-${{ steps.apk.outputs.label }}
          path: |
            ${{ steps.sum.outputs.file }}
            ${{ steps.sum.outputs.file }}.sha256
            app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload smoke-check output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-smoke-check
          path: dex-packages.txt
          if-no-files-found: ignore
          retention-days: 14
