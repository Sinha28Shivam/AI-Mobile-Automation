# JARVIS sample configuration: documents the safe defaults the app ships with.
# Contains no secrets. In-app settings (DataStore) are the source of truth on device.

# Wake phrase spotted by the local Vosk keyword recognizer (fixed in this build).
wake.phrase=hey jarvis
# 0.0 = fewest accidental triggers, 1.0 = most sensitive.
wake.sensitivity=0.5

# Local command history (last 20, app-private storage). Off by default.
history.enabled=false

# Optional local LLM interpreter for unrecognised commands. Disabled by default;
# no cloud endpoint is ever used.
llm.enabled=false
llm.model.path=

# Speech model is installed via the in-app "Speech model" screen (download or import).
speech.model=vosk-model-small-en-us-0.15